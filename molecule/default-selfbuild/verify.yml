---
- name: Verify YOURLS systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for YOURLS service to become active (up to 180s)
      ansible.builtin.systemd:
        name: yourls.service
      register: yourls_service
      until: yourls_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert YOURLS service is active
      ansible.builtin.assert:
        that: yourls_service.status.ActiveState == 'active'
        fail_msg: "yourls.service not active ({{ yourls_service.status.ActiveState }})"
        success_msg: "yourls.service is active"

    - name: Retrieve YOURLS service log for debugging
      when: yourls_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu yourls.service
      changed_when: false

    - name: Wait for YOURLS HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/admin/install.php"
        method: GET
        status_code: [200, 302, 307]
        follow_redirects: none
      register: yourls_endpoint
      until: yourls_endpoint.status in [200, 302, 307]
      retries: 120
      delay: 5

    - name: Assert YOURLS HTTP endpoint responds
      ansible.builtin.assert:
        that: yourls_endpoint.status in [200, 302, 307]
        fail_msg: "YOURLS did not respond as expected ({{ yourls_endpoint.status | default('no response') }})"
        success_msg: "YOURLS responded with {{ yourls_endpoint.status }}"

    - name: Show YOURLS systemd service status summary
      ansible.builtin.debug:
        msg:
          - "YOURLS systemd: {{ yourls_service.status.ActiveState }}"
          - "YOURLS HTTP: {{ yourls_endpoint.status }}"
