---
# YOURLS ships no unattended installer and the container image does not run one
# either: a freshly deployed instance answers HTTP, but has no tables at all and
# 307-redirects every request to `/admin/install.php`. The role leaves that step
# to the operator, so the scenario has to perform it here before anything can be
# verified. `install.php` takes no nonce - the presence of an `install` parameter
# is the whole trigger - so a single request is enough.
- name: Install YOURLS for Molecule tests
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for YOURLS to serve its installer (up to 10m)
      ansible.builtin.uri:
        url: "{{ yourls_molecule_base_url }}/admin/install.php"
        method: GET
        status_code: [200]
        follow_redirects: none
      register: yourls_installer_page
      until: yourls_installer_page.status == 200
      retries: 120
      delay: 5

    - name: Ensure the YOURLS database tables are created
      ansible.builtin.uri:
        url: "{{ yourls_molecule_base_url }}/admin/install.php?install=1"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: yourls_install_result
      changed_when: "'YOURLS tables successfully created.' in yourls_install_result.content"

    # `File <tt>.htaccess</tt> successfully created/updated.` is reported even when
    # the SQL step fails, so the assertion names the SQL message exactly, plus the
    # `url` table under the prefix this scenario configures.
    - name: Assert YOURLS reported creating its tables under the configured prefix
      ansible.builtin.assert:
        that:
          - "'YOURLS tables successfully created.' in yourls_install_result.content"
          - "\"Table '\" ~ yourls_database_prefix ~ \"url' created.\" in yourls_install_result.content"
        fail_msg: "YOURLS did not report creating its tables: {{ yourls_install_result.content | regex_findall('<li>([^<]*)</li>') }}"
        success_msg: "YOURLS created its database tables under the '{{ yourls_database_prefix }}' prefix"
