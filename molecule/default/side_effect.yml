---
# YOURLS ships no unattended installer and the container image does not run one
# either: a freshly deployed instance answers HTTP, but has no tables at all and
# 307-redirects every request to `/admin/install.php`. The role leaves that step
# to the operator, so the scenario has to perform it here before anything can be
# verified. `install.php` takes no nonce - the presence of an `install` parameter
# is the whole trigger - so a single request is enough.
- name: Install YOURLS for Molecule tests
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all YOURLS scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/side_effect_tasks.yml"
